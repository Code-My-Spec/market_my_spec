# Kamal config for market_my_spec UAT. Same shape as deploy.yml, with
# different network alias.
#
# Run with: kamal deploy -d uat
#
# SOPS_AGE_KEY reaches bin/boot the same way it does in prod — see the
# note in deploy.yml.

service: market-my-spec
image: market-my-spec

servers:
  web:
    hosts:
      - 46.225.105.88           # UAT box (Hetzner cax11 ARM, Nuremberg)
    options:
      network: db_net
    proxy:
      ssl: true
      host: uat.marketmyspec.com
      app_port: 4000

registry:
  # cms-registry, colocated on the fuellytics box this env shares. Bound to
  # this box's private IP on the market-my-spec-eu-central network (the
  # box also sits on the older, cross-zone market-my-spec network at
  # 10.0.0.4 — vestigial, not what the registry listens on).
  server: 10.1.0.2:5000
  username: [KAMAL_REGISTRY_USERNAME]
  password: [KAMAL_REGISTRY_PASSWORD]

builder:
  arch: arm64
  local: true

env:
  clear:
    APP_ENV: uat
    AWS_REGION: us-east-1
  secret:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - SOPS_AGE_KEY

ssh:
  user: root
<% if ENV["CMS_SSH_KEY_PATH"] %>  keys_only: true
  keys: [ "<%= ENV["CMS_SSH_KEY_PATH"] %>" ]
<% end %>
